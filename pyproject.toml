[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-mcp"
version = "1.0.0"
description = "MCP server connecting Claude to Microsoft Outlook via Microsoft Graph API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.1.0",
    "httpx>=0.27.0",
    "msal>=1.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"

[tool.pytest.ini_options]
# tests/unit only: tests/integration holds scripts that talk to the real Graph
# API and need a token cache, so they are run by hand, never by a bare pytest.
testpaths = ["tests/unit"]
pythonpath = ["."]

# Only the package ships. Without this, setuptools' flat-layout auto-discovery
# also finds outlook_mcp_server.py and outlook_mcp_auth.py at the top level and
# refuses to build ("Multiple top-level packages discovered in a flat-layout"):
# those two are entry-point scripts for a checkout, not installable modules.
[tool.setuptools.packages.find]
include = ["outlook_mcp*"]
